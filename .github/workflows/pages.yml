name: Deploy repo pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build quiz manifest
        run: node scripts/build-quiz-manifest.mjs

      - name: Validate Pretest C password hash
        env:
          PRETEST_C_PASSWORD_SHA256: ${{ secrets.PRETEST_C_PASSWORD_SHA256 }}
        run: |
          if [[ ! "${PRETEST_C_PASSWORD_SHA256}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "PRETEST_C_PASSWORD_SHA256 must be a 64-character SHA-256 hash."
            exit 1
          fi

      - name: Assemble Pages site
        env:
          PRETEST_C_PASSWORD_SHA256: ${{ secrets.PRETEST_C_PASSWORD_SHA256 }}
        run: |
          rm -rf _site
          mkdir -p _site/msft _site/data
          cp -R ta/quizzes/. _site/
          install -m 0644 ta/mock/pretest-c.json _site/data/pretest-c.json
          cp -R msft/sharepoint _site/msft/
          printf '{"pretestCPasswordHash":"%s"}\n' \
            "${PRETEST_C_PASSWORD_SHA256,,}" > _site/mock-config.json
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
